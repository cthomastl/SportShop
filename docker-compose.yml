version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sportshop
      POSTGRES_USER: ${DB_USER:-sportshop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sportshop}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sportshop} -d sportshop"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sportshop_net

  api:
    build: ./api
    environment:
      DB_URL: jdbc:postgresql://db:5432/sportshop
      DB_USER: ${DB_USER:-sportshop}
      DB_PASSWORD: ${DB_PASSWORD:-sportshop}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sportshop_net
    restart: on-failure

  web:
    build: ./web
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - sportshop_net

volumes:
  db_data:

networks:
  sportshop_net:
    driver: bridge
