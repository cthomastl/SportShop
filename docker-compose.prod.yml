version: '3.8'

services:
  api:
    image: ${REGISTRY}/sportshop-api:${IMAGE_TAG:-latest}
    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"
    networks:
      - sportshop_net
    restart: unless-stopped

  web:
    image: ${REGISTRY}/sportshop-web:${IMAGE_TAG:-latest}
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - sportshop_net
    restart: unless-stopped

networks:
  sportshop_net:
    driver: bridge
