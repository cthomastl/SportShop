<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart – SportShop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="util-bar">
  <div class="util-left">
    <span>(555) 867-5309</span>
    <span class="util-sep">|</span>
    <a href="#">Email Us</a>
    <span class="util-sep">|</span>
    <a href="#">Log In</a>
  </div>
  <div>
    <a href="cart.html" class="cart-header-link">VIEW CART (<span id="cart-badge">0</span> items)</a>
  </div>
</div>

<div class="site-header">
  <div class="site-header-inner">
    <a href="index.html" class="logo">SPORT<span>SHOP</span></a>
    <div class="search-wrap">
      <input type="text" class="search-input" placeholder="Search products...">
      <button class="search-btn">&#128269; Search</button>
    </div>
    <div class="header-btns">
      <a href="cart.html" class="hdr-btn">CART</a>
      <a href="cart.html" class="hdr-btn hdr-btn-secondary">ORDER HISTORY</a>
    </div>
  </div>
</div>

<div class="browse-bar">&#9776; BROWSE CATALOG</div>

<div class="fw-page">
  <div class="page-title">Your Shopping Cart</div>
  <div id="cart-content"></div>
</div>

<footer>&copy; 2025 SportShop &mdash; All rights reserved.</footer>

<script src="js/cart.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  renderCart();

  function renderCart() {
    const items = Cart.get();
    const el = document.getElementById('cart-content');

    if (items.length === 0) {
      el.innerHTML = `
        <div class="empty-msg">
          <div class="big-icon">&#128722;</div>
          <h3>Your cart is empty</h3>
          <p>Browse our catalog to find sporting goods.</p>
          <a href="index.html" class="btn btn-green">Browse Products</a>
        </div>`;
      return;
    }

    const total = Cart.getTotal();
    const itemCount = Cart.getCount();

    el.innerHTML = `
      <div class="cart-layout">
        <div class="cart-main">
          <table class="data-table">
            <thead>
              <tr>
                <th>Item</th>
                <th>Unit Price</th>
                <th>Quantity</th>
                <th class="text-right">Subtotal</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              ${items.map(i => `
                <tr data-id="${i.productId}">
                  <td>
                    <div class="item-cell">
                      <span class="item-emoji">${i.emoji}</span>
                      <div>
                        <div class="item-info-name">${esc(i.name)}</div>
                        <div class="item-info-cat">${esc(i.category)}</div>
                      </div>
                    </div>
                  </td>
                  <td>$${i.price.toFixed(2)}</td>
                  <td>
                    <div class="qty-box">
                      <button class="qty-btn qty-minus" data-id="${i.productId}">&#8722;</button>
                      <span class="qty-val">${i.quantity}</span>
                      <button class="qty-btn qty-plus" data-id="${i.productId}">+</button>
                    </div>
                  </td>
                  <td class="text-right" style="font-weight:bold;">$${(i.price * i.quantity).toFixed(2)}</td>
                  <td><button class="btn-del remove-item" data-id="${i.productId}" title="Remove">&times;</button></td>
                </tr>`).join('')}
            </tbody>
          </table>
          <div class="cart-actions">
            <a href="index.html" class="btn">&laquo; Continue Shopping</a>
            <button id="clear-cart" class="btn" style="margin-left:auto;">Clear Cart</button>
          </div>
        </div>
        <div class="order-box">
          <div class="order-box-head">Order Summary</div>
          <div class="sum-row">
            <span>${itemCount} item${itemCount !== 1 ? 's' : ''}</span>
            <span>$${total.toFixed(2)}</span>
          </div>
          <div class="sum-row">
            <span>Shipping</span>
            <span style="color:#1a5a1a;font-weight:bold;">FREE</span>
          </div>
          <div class="sum-total">
            <span>TOTAL</span>
            <span>$${total.toFixed(2)}</span>
          </div>
          <div class="order-box-btns">
            <a href="checkout.html" class="btn btn-green">Proceed to Checkout &rsaquo;</a>
          </div>
        </div>
      </div>`;

    document.querySelectorAll('.qty-minus').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = parseInt(btn.dataset.id);
        const item = Cart.get().find(i => i.productId === id);
        if (item) Cart.updateQty(id, item.quantity - 1);
        renderCart();
      });
    });

    document.querySelectorAll('.qty-plus').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = parseInt(btn.dataset.id);
        const item = Cart.get().find(i => i.productId === id);
        if (item) Cart.updateQty(id, item.quantity + 1);
        renderCart();
      });
    });

    document.querySelectorAll('.remove-item').forEach(btn => {
      btn.addEventListener('click', () => {
        Cart.removeItem(parseInt(btn.dataset.id));
        renderCart();
      });
    });

    document.getElementById('clear-cart').addEventListener('click', () => {
      if (confirm('Remove all items from your cart?')) {
        Cart.clear();
        renderCart();
      }
    });
  }

  function esc(str) {
    return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
});
</script>
</body>
</html>
