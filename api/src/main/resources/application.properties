spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/sportshop}
spring.datasource.username=${DB_USER:sportshop}
spring.datasource.password=${DB_PASSWORD:sportshop}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
server.port=8080
