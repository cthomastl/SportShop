# Fill in your real values, then apply with:
#   kubectl apply -f k8s/api-secret.yaml
#
# DO NOT commit this file with real credentials.
# Add api-secret.yaml to .gitignore if you want to store it locally.
apiVersion: v1
kind: Secret
metadata:
  name: sportshop-api-secret
  namespace: sportshop
type: Opaque
stringData:
  DB_URL: "jdbc:postgresql://<your-rds-host>:5432/sportshop?sslmode=require"
  DB_USER: "<your-db-user>"
  DB_PASSWORD: "<your-db-password>"
