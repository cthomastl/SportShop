apiVersion: apps/v1
kind: Deployment
metadata:
  name: sportshop-api
  namespace: sportshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sportshop-api
  template:
    metadata:
      labels:
        app: sportshop-api
    spec:
      containers:
        - name: api
          image: ghcr.io/YOUR_GITHUB_USERNAME/sportshop-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: sportshop-api-secret
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
