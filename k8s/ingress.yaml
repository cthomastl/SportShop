# Requires an nginx ingress controller installed in your cluster.
# Install via: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/cloud/deploy.yaml
#
# Replace sportshop.example.com with your actual domain.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sportshop-ingress
  namespace: sportshop
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
spec:
  ingressClassName: nginx
  rules:
    - host: sportshop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sportshop-web
                port:
                  number: 80
