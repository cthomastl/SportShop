apiVersion: apps/v1
kind: Deployment
metadata:
  name: sportshop-web
  namespace: sportshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sportshop-web
  template:
    metadata:
      labels:
        app: sportshop-web
    spec:
      containers:
        - name: web
          image: ghcr.io/YOUR_GITHUB_USERNAME/sportshop-web:latest
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
      volumes:
        - name: nginx-config
          configMap:
            name: sportshop-web-config
